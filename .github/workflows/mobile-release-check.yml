name: Mobile release check

on:
  pull_request:
  push:
    branches: [work, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Analyze, test, and build release APK
        run: ./tool/verify_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: scan-and-open-unsigned-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
