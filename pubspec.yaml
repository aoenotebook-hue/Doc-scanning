name: scan_and_open
description: Private, on-device document scanning and QR reading.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.0.7
  file_picker: ^10.3.3
  image: ^4.5.4
  image_picker: ^1.2.0
  mobile_scanner: ^7.1.3
  path_provider: ^2.1.5
  pdf: ^3.11.3
  share_plus: ^12.0.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
